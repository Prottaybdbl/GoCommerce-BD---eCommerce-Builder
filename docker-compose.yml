services:
  postgres:
    image: postgres:18-alpine
    container_name: gocom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gocom_user
      POSTGRES_PASSWORD: gocom_local_secret
      POSTGRES_DB: gocom_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocom_user -d gocom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: gocom-valkey
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
